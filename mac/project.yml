# Xcode project of the Mac app, generated by XcodeGen: `xcodegen generate` in this folder.
# The generated Clipway.xcodeproj is committed, so xcodebuild works without XcodeGen.
name: Clipway
options:
  bundleIdPrefix: dev.sidali
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ClipwayCore:
    path: ClipwayCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "5"
    # Ad hoc signature: no Apple team, no provisioning profile.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Release:
      # No debugger entitlement in release builds.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  Clipway:
    type: application
    platform: macOS
    sources:
      - path: Clipway
      # Shown in About (What's new, Privacy policy): the same files as the repository's.
      - path: ../CHANGELOG.md
        buildPhase: resources
      - path: ../PRIVACY.md
        buildPhase: resources
    dependencies:
      - package: ClipwayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sidali.clipway
        PRODUCT_NAME: Clipway
        CODE_SIGN_ENTITLEMENTS: Clipway/Clipway.entitlements
        INFOPLIST_FILE: Clipway/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # The Debug build is another app for macOS: its own sandbox container, Keychain items and
        # settings, so tests never touch the key and history of the installed Clipway.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.sidali.clipway.debug
    info:
      path: Clipway/Info.plist
      properties:
        CFBundleName: Clipway
        CFBundleDisplayName: Clipway
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Sid, sidali.dev. Apache License 2.0."
        # Files received from the phone carry the quarantine attribute, so Gatekeeper checks them.
        LSFileQuarantineEnabled: true
        # Loopback only (a relay on this Mac, for tests). The app itself requires https:// in release builds.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Asked when a Pair nearby window opens, never at launch (docs/PROTOCOL.md, 13.8).
        NSBluetoothAlwaysUsageDescription: "Clipway uses Bluetooth only while you pair a phone nearby, to show the same code on both screens."
        # Images and files go straight to the phone over the local network (docs/PROTOCOL.md, section 14).
        NSLocalNetworkUsageDescription: "Clipway sends images and files straight to your phone over your local network, without any server."
schemes:
  Clipway:
    build:
      targets:
        Clipway: all
